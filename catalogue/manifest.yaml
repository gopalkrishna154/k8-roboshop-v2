apiVersion: v1

kind: ConfigMap

metadata:
  name: catalogue
  namespace: roboshop

data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: apps/v1

kind: Deployment

metadata:
  name: catalogue
  namespace: roboshop

  # labels related to deployment resources
  labels:
    project: roboshop
    tier: backend
    component: catalogue

spec:
  replicas: 1

  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: catalogue

  # pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: catalogue

    spec:
      containers:
        - name: catalogue
          image: joindevops/catalogue:4.0.0
          resources: 
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              requests:
              cpu: "100m"
              memory: "128Mi"
          envFrom:
          -  configMapRef:
                name: catalogue

---
apiVersion: v1

kind: Service

metadata:
  name: catalogue
  namespace: roboshop

  labels:
    project: roboshop
    tier: backend
    component: catalogue

spec:
  selector:
    project: roboshop
    tier: backend
    component: catalogue

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue
  namespace: roboshop
  labels: 
    project: roboshop
    tier: backend
    component: catalogue
spec:
  # The target workload to scale which is deployment reference
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  # Bounds for the replica count
  minReplicas: 1
  maxReplicas: 4
  # Metrics thresholds targeting 60% average utilization
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
